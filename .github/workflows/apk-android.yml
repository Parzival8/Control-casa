# Compila el APK de Android en GitHub (sin Expo ni Android Studio) y lo publica
# en "Releases" para descargarlo directamente desde el móvil.
#
# Requisito: secreto del repositorio GOOGLE_SERVICES_JSON con el contenido
# completo del archivo google-services.json (Settings → Secrets and variables
# → Actions). El archivo nunca se guarda en el repositorio.
#
# El APK va firmado con la clave de depuración que genera Expo: sirve para
# instalar y probar, NO para subir a Google Play (eso se prepara en la Fase 7).

name: APK Android

on:
  # Botón "Run workflow" en la pestaña Actions.
  workflow_dispatch:
  # Y automáticamente con cada push que cambie código (no documentación).
  push:
    paths-ignore:
      - '**.md'

permissions:
  contents: write # para crear la Release con el APK

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Preparar Gradle (con caché)
        uses: gradle/actions/setup-gradle@v4

      - name: Instalar dependencias
        run: npm ci

      - name: Tests y lint
        run: |
          npm test
          npm run lint

      - name: Crear google-services.json desde el secreto
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Falta el secreto GOOGLE_SERVICES_JSON en Settings → Secrets and variables → Actions."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json
          node -e "JSON.parse(require('fs').readFileSync('google-services.json','utf8'))" \
            || { echo "::error::El secreto GOOGLE_SERVICES_JSON no es un JSON válido."; exit 1; }

      - name: Generar el proyecto Android (expo prebuild)
        run: npx expo prebuild --platform android --no-install

      - name: Compilar el APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Renombrar el APK
        id: apk
        run: |
          VERSION=$(node -p "require('./package.json').version")
          RAMA=$(echo "${GITHUB_REF_NAME}" | tr '/' '-')
          NOMBRE="control-casa-${VERSION}-${GITHUB_RUN_NUMBER}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$NOMBRE"
          echo "nombre=$NOMBRE" >> "$GITHUB_OUTPUT"
          echo "etiqueta=apk-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "rama=$RAMA" >> "$GITHUB_OUTPUT"

      - name: Guardar el APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.nombre }}
          path: ${{ steps.apk.outputs.nombre }}

      - name: Publicar en Releases (descarga directa desde el móvil)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.apk.outputs.etiqueta }}" "${{ steps.apk.outputs.nombre }}" \
            --target "${GITHUB_SHA}" \
            --prerelease \
            --title "APK de prueba #${GITHUB_RUN_NUMBER} (${{ steps.apk.outputs.rama }})" \
            --notes "APK de prueba compilado desde la rama ${GITHUB_REF_NAME} (commit ${GITHUB_SHA::7}). Firmado con clave de depuración: solo para instalar y probar, no para Google Play."
